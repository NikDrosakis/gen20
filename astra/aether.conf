}

	location ~ \.php$ {
	fastcgi_pass unix:/run/php/php8.2-fpm.sock;
	fastcgi_index index.php;
    include /etc/nginx/snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    	    set $api_dir "api";
            fastcgi_param SYSTEM $api_dir;
    include /etc/nginx/fastcgi_params;
   }
rewrite ^/api/v1/([a-zA-Z0-9_]+)/?$ /api/v1/index.php?resource=$1&id=$2;
rewrite ^/api/v1/([a-zA-Z0-9_]+)/([a-zA-Z0-9._]+)/?$ /api/v1/index.php?resource=$1&id=$2&action=$3;
rewrite ^/api/v1/([a-zA-Z0-9_]+)/([a-zA-Z0-9._]+)/([a-zA-Z0-9._]+)/?$ /api/v1/index.php?resource=$1&id=$2&action=$3;
}

##ERMIS nodejs + ws
  # ===== ERMIS PROXY =====
    location /ermis/v1/ {
        # Proxy to Node.js (HTTP, no SSL)
        proxy_pass http://127.0.0.1:3010/;

        # Timeouts for long-running connections (streaming)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Standard proxy headers
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ===== WEBSOCKET SPECIFIC =====
# /etc/nginx/sites-available/gen20.gr
location /ermis/v1/ws {
    proxy_pass http://127.0.0.1:3010/ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket timeouts
    proxy_read_timeout 3600s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 3600s;

    # ΚΡΙΤΙΚΟ: off για WebSocket
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;

    # CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
}
##################
# TESTING service
##################
    location /tests/ {
        alias /var/www/gs/gaia/tests/;  # Points to the actual test directory
        index index.php index.html;

        # Handle PHP files for tests
        location ~ \.php$ {
            try_files $uri =404;  # Return 404 if file doesn't exist
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # Use the correct PHP-FPM socket
            include snippets/fastcgi-php.conf;  # Ensure proper configuration for PHP-FPM
            fastcgi_param SCRIPT_FILENAME $request_filename;  # Set SCRIPT_FILENAME param for PHP
            set $tests_dir "tests";  # You can define any custom variable for your system
            fastcgi_param SYSTEM $tests_dir;  # Optional, passing extra params if needed
            include fastcgi_params;  # Ensure basic fastcgi params are passed
        }
    }

