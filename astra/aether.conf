# ADMIN service
location /admin {
    alias /var/www/gs/moon/admin/dist;
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    try_files $uri $uri/ /admin/index.html;
    # SPA fallback
    location ~ /admin/.* {
        try_files $uri /admin/index.html;
    }
}

## KRONOS service
location /apy/v1 {
    proxy_pass http://127.0.0.1:3006;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    proxy_redirect off;
    proxy_buffering off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Cache-Status $upstream_cache_status;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin 'http://localhost:3000' always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Range' always;
        add_header Content-Length 0;
        add_header Content-Type 'text/plain; charset=UTF-8';
        return 204;
    }
}

##storage box
# /var/www/gs/astra/aether.conf

# Ασφάλεια: μπλοκάρισμα άμεσης πρόσβασης σε /data
location ^~ /data/ {
    internal;
    alias /var/www/gs/data/;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    default_type application/json;
}
##storage box
location /media {
    proxy_set_header Host $host;
    autoindex on;
    alias /var/www/gs/media/$host;
    try_files $uri $uri/ =404;
        expires max;
        add_header Cache-Control "public";
}

