# GPM phpmyadmin opcache phpliteadmin
##################
location /tools {
alias /var/www/tools;
 index index.php index.html;
    location ~ \.php$ {
    try_files $uri =404;
	fastcgi_pass unix:/run/php/php8.2-fpm.sock;
	include /etc/nginx/snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    include /etc/nginx/fastcgi_params;
    }
}


##PHP API
location /api/v1  {
    alias /var/www/gs/gaia/apiv1;
    index index.php;
# CORS Headers for the API
if ($request_method = OPTIONS) {
    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Range' always;
    add_header 'Content-Length' 0 always;
    add_header 'Content-Type' 'text/plain charset=UTF-8' always;
    return 204;
}

	location ~ \.php$ {
	fastcgi_pass unix:/run/php/php8.2-fpm.sock;
	fastcgi_index index.php;
    include /etc/nginx/snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    	    set $api_dir "api";
            fastcgi_param SYSTEM $api_dir;
    include /etc/nginx/fastcgi_params;
   }
rewrite ^/api/v1/([a-zA-Z0-9_]+)/?$ /api/v1/index.php?resource=$1&id=$2;
rewrite ^/api/v1/([a-zA-Z0-9_]+)/([a-zA-Z0-9._]+)/?$ /api/v1/index.php?resource=$1&id=$2&action=$3;
rewrite ^/api/v1/([a-zA-Z0-9_]+)/([a-zA-Z0-9._]+)/([a-zA-Z0-9._]+)/?$ /api/v1/index.php?resource=$1&id=$2&action=$3;
}

