# for Arango proxy
location /_api {
proxy_pass http://localhost:8529;  # ArangoDB's default port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ensure WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
}

location /mars {
    grpc_pass grpc://localhost:3004;
    error_page 502 = /error502.html;

    # Increase gRPC buffer size if needed
    grpc_set_header Content-Length 0;
    grpc_read_timeout 3600s;
    grpc_send_timeout 3600s;

    # Set host headers properly
    grpc_set_header Host $host;
}

## kronos service
location /apy/v1 {
    proxy_pass http://localhost:3006;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection; # Correct way
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Frame-Options SAMEORIGIN;
    proxy_set_header X-Content-Type-Options nosniff;
    proxy_set_header X-XSS-Protection "1; mode=block";
    if ($request_method !~ ^(GET|POST|DELETE|PUT)$ ) {
        return 405;
    }
   proxy_cache_valid 200 10m;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Range' always;
        add_header 'Content-Length' 0 always;
        add_header 'Content-Type' 'text/plain charset=UTF-8' always;
        return 204;
    }
}

##storage box
location /data {
    proxy_set_header Host $host;
    autoindex on;
    alias /var/www/gs/data/$host;
    try_files $uri $uri/ =404;
        expires max;
        add_header Cache-Control "public";
}
##storage box
location /media {
    proxy_set_header Host $host;
    autoindex on;
    alias /var/www/gs/media/$host;
    try_files $uri $uri/ =404;
        expires max;
        add_header Cache-Control "public";
}

