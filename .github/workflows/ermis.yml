name: Ermis CI

on:
  push:
    branches: [main]
    paths:
      - "ermis/**"
      - ".github/workflows/ermis.yml"
  pull_request:
    paths:
      - "ermis/**"
      - ".github/workflows/ermis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ermis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ermis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ermis/yarn.lock
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test --runInBand
