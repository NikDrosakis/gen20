name: Docker Image Validation (No Publish)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service image to build"
        type: choice
        required: true
        default: god
        options:
          - god
          - ermis
          - kronos

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build selected service image (no push)
        run: |
          case "${{ inputs.service }}" in
            god) docker build -f god/Dockerfile -t gen20/god:ci god ;;
            ermis) docker build -f ermis/Dockerfile -t gen20/ermis:ci ermis ;;
            kronos) docker build -f kronos/Dockerfile -t gen20/kronos:ci kronos ;;
            *) echo "Unsupported service"; exit 1 ;;
          esac
