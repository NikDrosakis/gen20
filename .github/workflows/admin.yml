name: Gaia Core CI

on:
  push:
    branches: [main]
    paths:
      - "gaia/core/**"
      - "gaia/tests/**"
      - "gaia/composer.json"
      - "gaia/composer.lock"
      - "gaia/phpunit.xml"
      - ".github/workflows/admin.yml"
  pull_request:
    paths:
      - "gaia/core/**"
      - "gaia/tests/**"
      - "gaia/composer.json"
      - "gaia/composer.lock"
      - "gaia/phpunit.xml"
      - ".github/workflows/admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaia-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gaia
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax check — Gaia core
        run: find core -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l
      - name: Run PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml
