name: God Go CI

on:
  push:
    branches: [main]
    paths:
      - "god/**"
      - ".github/workflows/god.yml"
  pull_request:
    paths:
      - "god/**"
      - ".github/workflows/god.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: god-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: god
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: god/go.mod
          cache: true
          cache-dependency-path: god/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...
      - name: Build binary
        run: go build -o /tmp/gen20-god .
