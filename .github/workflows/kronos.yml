name: Kronos Python CI

on:
  push:
    branches: [main]
    paths:
      - "kronos/**"
      - ".github/workflows/kronos.yml"
  pull_request:
    paths:
      - "kronos/**"
      - ".github/workflows/kronos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kronos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kronos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check application module syntax
        run: |
          python -m py_compile \
            main.py action.py actionplan.py ai_client.py ai_server.py \
            config.py services.py ws.py ws_endpoint.py ws_receive.py ws_send.py
