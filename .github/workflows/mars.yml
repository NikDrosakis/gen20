name: Mars C++ CI

on:
  push:
    branches: [main]
    paths:
      - "mars/**"
      - ".github/workflows/mars.yml"
  pull_request:
    paths:
      - "mars/**"
      - ".github/workflows/mars.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mars-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libmariadb-dev libmariadbcpp-dev \
            libyaml-cpp-dev libhiredis-dev libssl-dev \
            libboost-all-dev libwebsocketpp-dev nlohmann-json3-dev
      - name: Clean build artifacts
        run: make -C mars clean
      - name: Build Mars
        run: make -C mars
