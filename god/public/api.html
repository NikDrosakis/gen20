<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --get: #22c55e;
            --post: #3b82f6;
            --put: #f59e0b;
            --delete: #ef4444;
            --patch: #a855f7;
            --other: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .stat {
            background: var(--card);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .stat strong {
            color: var(--accent);
            font-weight: 700;
        }

        .search-bar {
            margin-bottom: 1.5rem;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-bar input::placeholder {
            color: var(--muted);
        }

        .routes {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .route {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--card);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: transform 0.15s, border-color 0.15s;
        }

        .route:hover {
            transform: translateX(4px);
            border-color: var(--accent);
        }

        .method {
            display: inline-block;
            min-width: 70px;
            text-align: center;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fff;
        }

        .method.GET    { background: var(--get); }
        .method.POST   { background: var(--post); }
        .method.PUT    { background: var(--put); }
        .method.DELETE { background: var(--delete); }
        .method.PATCH  { background: var(--patch); }
        .method.HEAD,
        .method.OPTIONS { background: var(--other); }

        .path {
            color: var(--accent);
            text-decoration: none;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            transition: color 0.15s;
        }

        .path:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
            background: var(--card);
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        .no-results {
            display: none;
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }

        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            h1 { font-size: 1.5rem; }
            .route { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .method { min-width: 60px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>{{ .title }}</h1>
        <p class="subtitle">Registered HTTP endpoints</p>
        <div class="stats">
            <div class="stat"><strong>{{ len .routes }}</strong> endpoints</div>
        </div>
    </header>

    <div class="search-bar">
        <input type="text" id="search" placeholder="Search routes… (e.g. /god/v1/, GET, chat)" autocomplete="off">
    </div>

    <div class="routes" id="routes">
        {{ range .routes }}
        <div class="route" data-search="{{ .Path }} {{ .Method }}">
            <span class="method {{ .Method }}">{{ .Method }}</span>
            <a class="path" href="{{ .Path }}">{{ .Path }}</a>
        </div>
        {{ else }}
        <div class="empty">
            <p>No endpoints available</p>
        </div>
        {{ end }}
    </div>
    <div class="no-results" id="noResults">
        <p>No routes match your search.</p>
    </div>

    <footer>
        Gen20 God API · {{ .title }}
    </footer>
</div>

<script>
    (function () {
        const input = document.getElementById('search');
        const routes = document.querySelectorAll('.route');
        const noResults = document.getElementById('noResults');

        input.addEventListener('input', function () {
            const q = this.value.toLowerCase().trim();
            let visible = 0;

            routes.forEach(function (route) {
                const haystack = (route.dataset.search || '').toLowerCase();
                if (!q || haystack.includes(q)) {
                    route.style.display = '';
                    visible++;
                } else {
                    route.style.display = 'none';
                }
            });

            noResults.style.display = visible === 0 && q ? 'block' : 'none';
        });
    })();
</script>
</body>
</html>
